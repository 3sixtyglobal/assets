name: Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dist-all-packages:
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Install dependencies with retry
      - name: Install dependencies
        run: |
          for i in {1..3}; do
            pnpm install --frozen-lockfile && break || {
              if [ $i -eq 3 ]; then
                echo "pnpm install failed after 3 attempts"
                exit 1
              fi
              echo "pnpm install failed, retrying in 30 seconds (attempt $i/3)..."
              sleep 30
            }
          done

      # Setup any services required for tests here
      - name: Setup Test Environment
        uses: ./.github/workflows/setup-test-env

      # Run Lint and Dist
      - name: Run Lint and Dist
        run: |
          pnpm run lint
          pnpm run dist
