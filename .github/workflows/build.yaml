name: Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dist-all-packages:
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - name: Checkout
        uses: actions/checkout@v7

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Install dependencies with retry
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run Lint and Dist
      - name: Run Lint and Dist
        run: |
          pnpm run lint
          pnpm run dist
